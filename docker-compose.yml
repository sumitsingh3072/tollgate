# Full stack: docker compose up -d --build
# Infra only (for host dev):   docker compose up -d redis
# With local Postgres:         docker compose --profile localdb up -d
# Host ports are overridable (REDIS_PORT, POSTGRES_PORT, MOCK_PORT, BACKEND_PORT, FRONTEND_PORT).

x-restart: &restart
  restart: unless-stopped

services:
  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    <<: *restart
    profiles: ["localdb"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tollgate
      POSTGRES_PASSWORD: tollgate
      POSTGRES_DB: tollgate
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tollgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *restart
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MOCK_UPSTREAM_URL: http://mock-upstream:9000/v1
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy

  mock-upstream:
    <<: *restart
    build: ./backend
    command: ["python", "mock_upstream.py"]
    ports:
      - "127.0.0.1:${MOCK_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    <<: *restart
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8000}
    environment:
      GATEWAY_URL: http://backend:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
